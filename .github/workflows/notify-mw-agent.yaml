# Stage 1 of the synthetics release chain:
#   [this] synthetics-agent tag -> mw-agent go.mod bump PR -> (manual merge)
#   -> mw-synthetics/mw-opsai images -> helm-charts bump PR
#
# On a vX.Y.Z tag (including tags created from a GitHub release), asks mw-agent
# to open a PR bumping synthetics-agent to that version.
name: Notify mw-agent of release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing tag to send to mw-agent (e.g. v1.0.67)'
        required: true

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '$VERSION' (expected vX.Y.Z)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Dispatch to mw-agent
        env:
          GH_TOKEN: ${{ secrets.RELEASE_CHAIN_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh api repos/middleware-labs/mw-agent/dispatches \
            -f event_type=synthetics-agent-released \
            -f "client_payload[version]=${VERSION}"
          echo "Sent synthetics-agent-released ($VERSION) to middleware-labs/mw-agent" >> "$GITHUB_STEP_SUMMARY"
